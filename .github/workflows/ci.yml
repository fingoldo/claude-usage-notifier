name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Compile all modules (syntax sanity check)
        # No test suite (this is a small script collection, not a distributable package) --
        # compileall is the cheapest real signal that every module still parses.
        run: python -m compileall -q .

  # Reusable lint bundles from fingoldo/py-ci-shared, every ref and py-ci-shared-ref on the same release SHA.
  ruff-blocking:
    name: Ruff (real bugs - blocking)
    uses: fingoldo/py-ci-shared/.github/workflows/ruff-blocking.yml@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0
    with:
      py-ci-shared-ref: "6a8e3829678dab35e21d380292f7b34ae84c8d14"  # v1.17.0
      ignore: "C901"

  lint-blocking:
    name: lint + security (blocking, triaged clean)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-blocking.yml@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0
    with:
      source-path: "."
      codespell-paths: ". README.md"
      run-zizmor: true

  lint-advisory:
    name: lint (advisory)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-advisory.yml@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0
    with:
      py-ci-shared-ref: "6a8e3829678dab35e21d380292f7b34ae84c8d14"  # v1.17.0
      source-path: "."
