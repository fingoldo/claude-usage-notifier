name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Compile all modules (syntax sanity check)
        # No test suite (this is a small script collection, not a distributable package) --
        # compileall is the cheapest real signal that every module still parses.
        run: python -m compileall -q .

  # Reusable lint bundles from fingoldo/py-ci-shared (same pattern as pyutilz/mlframe), pinned
  # to the same tag those repos use.
  ruff-blocking:
    name: Ruff (real bugs - blocking)
    uses: fingoldo/py-ci-shared/.github/workflows/ruff-blocking.yml@f26052fd4fee0d667aa6f4c3290d77e7ca6c1c06  # v1.2.0
    with:
      ignore: "C901"

  lint-blocking:
    name: lint + security (blocking, triaged clean)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-blocking.yml@f26052fd4fee0d667aa6f4c3290d77e7ca6c1c06  # v1.2.0
    with:
      source-path: "."
      codespell-paths: ". README.md"
      run-zizmor: true

  lint-advisory:
    name: lint (advisory)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-advisory.yml@f26052fd4fee0d667aa6f4c3290d77e7ca6c1c06  # v1.2.0
    with:
      source-path: "."
