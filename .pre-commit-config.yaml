repos:
  - repo: local
    hooks:
      - id: ruff-real-bugs
        name: "ruff (real bugs block)"
        entry: python -m ruff check --ignore C901
        language: system
        types: [python]
        stages: [pre-commit]

      - id: black
        name: "black"
        entry: python -m black
        language: system
        types: [python]
        stages: [pre-commit]
