[project]
name = "claude-usage-notifier"
version = "0.1.0"
description = "Monitors claude.ai's weekly usage limit and alerts across Telegram, email, OS notification, and sound if it resets early."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "plyer>=2.1",
]

[project.optional-dependencies]
# The pre-commit hooks run these with `language: system`: `pip install -e ".[dev]"` before `pre-commit install`.
dev = [
    "py-ci-shared @ git+https://github.com/fingoldo/py-ci-shared@6a8e3829678dab35e21d380292f7b34ae84c8d14",  # v1.17.0
    "ruff==0.16.1",
    "pytest>=8.0",
]

[tool.black]
line-length = 160
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
# $PY_CI_SHARED_DIR, not a sibling checkout: CI's ruff-blocking workflow sets it to the pinned release, and locally
# `python -m py_ci_shared.setup_env` persists it (or point it at the directory holding `py-ci-shared config-path ruff-base`).
extend = "$PY_CI_SHARED_DIR/configs/ruff-base.toml"
target-version = "py310"
exclude = ["browser_profile", ".git", "__pycache__", "build", "dist"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# These are all small CLI entry points whose entire job is printing to the console
# (login instructions, the raw usage JSON, a fatal error) -- that IS the interface,
# not debug leftovers. Same exemption class as pyutilz's notebook_init.py/decodo.py.
"fetch_usage.py" = ["T201"]
"monitor.py" = ["T201"]

[tool.codespell]
ignore-words-list = "claude"
skip = "browser_profile,*.log,*.json"

[tool.deptry]
exclude = ["browser_profile", ".venv", "build", "dist"]
